user-agent: MarvideoStatusBot/1.0
status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.marvideo.fr
  # baseUrl: /your-repo-name
  logoUrl: https://s3.marvideo.fr/assets/Marvideo.png
  favicon: https://s3.marvideo.fr/assets/Marvideo.png
  name: "Marvideo • État des services"
  introTitle: ""
  introMessage: Marvideo Services
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER

  theme: dark
  css: |
    :root {
      --bg-primary: #2e3440;
      --bg-secondary: #3b4252;
      --text-color: #eceff4;
      --accent-color: #88c0d0;
      --success-color: #a3be8c;
      --warning-color: #ebcb8b;
      --danger-color: #bf616a;
    }
    body {
      background-color: var(--bg-primary) !important;
      color: var(--text-color) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card, .box, header {
      background-color: var(--bg-secondary) !important;
      border-radius: 8px !important;
      border: 1px solid #4c566a !important;
    }
  
  # Textes personnalisés (style direct / fait-maison)
  i18n:
    footer: "Surveillé automatiquement par GitHub Actions. Aucun serveur n'a été maltraité."
    dashboards: "Toutes les métriques"
    statusAllUp: "Tous les services fonctionnent normalement."
    statusAllDown: "Tout est au tapis pour l'instant."
    statusSomeDown: "Quelques perturbations en cours."

